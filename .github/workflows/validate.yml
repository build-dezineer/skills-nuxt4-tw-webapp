name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Repository checks
        run: npm run validate

      - name: Index is fresh
        run: npm run index:check

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Spec validation (skills-ref)
        run: npm run validate:spec
